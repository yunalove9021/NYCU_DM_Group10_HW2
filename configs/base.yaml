# Paths are relative to this YAML file.
input: ../data
output: ../output
random_seeds: [42, 123, 456, 789, 1105]

data:
  train_file: nodes_train.csv
  val_file: nodes_validation.csv
  test_files:
    test_before_event: nodes_test_pre_event.csv
    test_after_event: nodes_test_post_event.csv
  edge_files:
    train: edge_train.csv
    val: edge_validation.csv
    test_before_event: edge_test_pre_event.csv
    test_after_event: edge_test_post_event.csv
  label_column: y
  # Each JSON is a separate feature set; paths are relative to this YAML.
  feature_columns:
    - feature_sets/basic.json
    - feature_sets/local_features.json
    - feature_sets/feature_selection_cor_095.json
    - feature_sets/feature_selection_cor_09.json
    # - feature_sets/selected.json
  feature_start_index: 4

models:
  # python main.py --config configs/base.yaml --model RF
  RF:
    params:
      n_estimators: 300
      class_weight: balanced
      n_jobs: -1

  # python main.py --config configs/base.yaml --model GCN_RF
  GCN_RF:
    params:
      n_estimators: 300
      class_weight: balanced
      n_jobs: -1
    encoder:
      name: GCN
      device: auto
      # Keep txId1 -> txId2 direction; true adds reverse edges.
      undirected: false
      params:
        hidden_dim: 128
        embedding_dim: 100
        num_layers: 2
        dropout: 0.3
        learning_rate: 0.001
        epochs: 10
        patience: 20
      loss:
        name: weighted_cross_entropy
        class_weights: balanced

  # python main.py --config configs/base.yaml --model random_score
  random_score:
    params: {}
    
  # python main.py --config configs/base.yaml --model single_feature
  single_feature:
    params:
      feature_name: "feature_18"
    
  # python main.py --config configs/base.yaml --model isolation_forest
  isolation_forest:
    params:
      n_estimators: 300
      reverse_score: false
    
  # python main.py --config configs/base.yaml --model AE
  AE:
    params:
      latent_dim: 32
      batch_size: 256
      epochs: 50
      lr: 0.0005
      loss_type: "MSE"          # 可填 "MSE" 或 "L1"
      reverse_score: true      # 依據資料集特性選擇是否倒置分數
  
  # python main.py --config configs/base.yaml --model GAE
  GAE:
    params:
      latent_dim: 64
      epochs: 100
      lr: 0.0005
      loss_type: "MSE"          # 可填 "MSE" 或 "L1"
      undirected: true         # true 代表雙向圖，false 代表單向圖
      reverse_score: true      # 決定是否倒置異常分數
